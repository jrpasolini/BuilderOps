name: Smoke test deployed BuilderOps API

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live API and authentication boundary
        shell: bash
        run: |
          set -euo pipefail
          API="https://builderops.antonio-pasolini.workers.dev"
          for attempt in {1..5}; do
            code="$(curl -L -sS --max-time 12 -o health.json -w '%{http_code}' "$API/api/health" || true)"
            if [[ "$code" == "200" ]]; then break; fi
            echo "Health attempt $attempt returned $code"
            sleep 2
          done
          [[ "$code" == "200" ]]
          python3 -c 'import json; body=json.load(open("health.json")); assert body["ok"] is True and body["service"] == "builderops"; print("Health confirmed")'
          curl -fsS --max-time 12 "$API/api/config" -o config.json
          python3 -c 'import json; body=json.load(open("config.json")); assert body["ready"] is True and body["audience"] == "https://builderops-api"; print("Public Auth0 config confirmed")'
          code="$(curl -sS --max-time 12 -o unauthorized.json -w '%{http_code}' "$API/api/profile")"
          [[ "$code" == "401" ]]
          code="$(curl -sS --max-time 12 -o /dev/null -w '%{http_code}' -X OPTIONS -H "Origin: https://jrpasolini.github.io" -H "Access-Control-Request-Method: POST" "$API/api/chat")"
          [[ "$code" == "204" ]]
          echo "Public health, configuration, unauthorized guard and CORS verified"
