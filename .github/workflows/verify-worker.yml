name: Verify Cloudflare Worker build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm run check
      - name: Validate Cloudflare build (no deploy)
        run: npm run build
      - name: Publish bundled Worker to build-only branch
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const path = 'bundle/index.js';
            const file = '.cloudflare/output/v0/workers/default/bundle/index.js';
            const contents = fs.readFileSync(file).toString('base64');
            const {owner,repo} = context.repo;
            let sha;
            try {
              const existing = await github.rest.repos.getContent({
                owner,repo,path,ref:'worker-build'
              });
              sha = existing.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner,repo,path,branch:'worker-build',sha,
              message:'build: Worker bundle for ' + context.sha.slice(0,12),
              content:contents,
            });
            core.info('Bundled Worker published to worker-build branch');
